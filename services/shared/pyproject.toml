[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carrier-shared"
version = "0.1.0"
description = "Shared utilities for CarrierBackOffice platform"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "python-jose[cryptography]>=3.3",
    "boto3>=1.34",
    "redis>=5.0",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
